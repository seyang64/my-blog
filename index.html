<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <meta name="color-scheme" content="light dark">
  <title>My Blog</title>
  <script>
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) { /* storage unavailable */ }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="#/">My Blog</a>
      <button class="theme-toggle" type="button" aria-label="테마 전환">🌙</button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="status">불러오는 중…</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> My Blog</p>
    </div>
  </footer>

  <script>
    // Browsers block module scripts and fetch() on file://, so explain how to open the blog.
    if (location.protocol === 'file:') {
      const app = document.getElementById('app');
      const box = document.createElement('section');
      box.className = 'error';
      const title = document.createElement('h1');
      title.textContent = '블로그를 열 수 없습니다';
      const p1 = document.createElement('p');
      p1.textContent = 'index.html 파일을 직접 열면 브라우저 보안 정책 때문에 글을 불러올 수 없습니다.';
      const p2 = document.createElement('p');
      p2.append('my-blog 폴더의 ');
      const bat = document.createElement('code');
      bat.textContent = 'start-blog.bat';
      p2.append(bat, ' 파일을 더블클릭하면 블로그가 열립니다.');
      box.append(title, p1, p2);
      app.replaceChildren(box);
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
