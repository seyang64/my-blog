<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="My Blog — notes and writing">
  <meta name="theme-color" content="#050507">
  <title>My Blog</title>
  <!-- Apply the saved neon color before first paint to avoid a flash -->
  <script>
    (() => {
      let c = 'cyan';
      try { c = localStorage.getItem('neon') || c; } catch (e) {}
      if (!['cyan', 'green', 'pink', 'amber'].includes(c)) c = 'cyan';
      document.documentElement.dataset.neon = c;
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <a class="logo" href="./">MY_BLOG<span class="cursor" aria-hidden="true">_</span></a>
        <button class="neon-switch" type="button" aria-label="Change neon color">
          <span class="neon-dot" aria-hidden="true"></span><span class="neon-name">cyan</span>
        </button>
      </div>
      <p class="tagline">// thoughts, notes &amp; signals</p>

      <nav class="side-block" aria-label="Filter by tag">
        <h2 class="side-title">tags</h2>
        <ul class="tag-filter" id="tag-filter"></ul>
      </nav>

      <footer class="side-footer">© <span id="year"></span> My Blog</footer>
    </aside>

    <main id="main" class="content">
      <section class="hero">
        <p class="prompt">&gt; ls ./posts</p>
        <h1>Recent <span class="glow">posts</span></h1>
        <p class="hero-sub" id="post-count">&nbsp;</p>
      </section>
      <ul class="post-grid" id="post-list" aria-live="polite">
        <li class="status">Loading posts…</li>
      </ul>
    </main>
  </div>
</body>
</html>
