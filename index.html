<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="My Blog — notes and writing">
  <meta name="theme-color" content="#ffffff">
  <title>My Blog</title>
  <!-- Apply saved / OS theme before first paint to avoid a flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="./">My Blog</a>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M1.5 12h3M19.5 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="container">
    <section class="intro">
      <h1>Recent posts</h1>
      <p class="muted">Thoughts, notes, and things I've learned.</p>
    </section>
    <ul class="post-list" id="post-list" aria-live="polite">
      <li class="status">Loading posts…</li>
    </ul>
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> My Blog</div>
  </footer>
</body>
</html>
