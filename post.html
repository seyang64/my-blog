<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050507">
  <title>Post — My Blog</title>
  <!-- Apply the saved neon color before first paint to avoid a flash -->
  <script>
    (() => {
      let c = 'cyan';
      try { c = localStorage.getItem('neon') || c; } catch (e) {}
      if (!['cyan', 'green', 'pink', 'amber'].includes(c)) c = 'cyan';
      document.documentElement.dataset.neon = c;
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body data-page="post">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>

  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <a class="logo" href="./">MY_BLOG<span class="cursor" aria-hidden="true">_</span></a>
        <button class="neon-switch" type="button" aria-label="Change neon color">
          <span class="neon-dot" aria-hidden="true"></span><span class="neon-name">cyan</span>
        </button>
      </div>
      <p class="tagline">// thoughts, notes &amp; signals</p>

      <nav class="side-block back-nav" aria-label="Back">
        <a href="./">&lt;- Back to list</a>
      </nav>

      <details class="side-block toc" id="toc" hidden open>
        <summary class="side-title">contents</summary>
        <ol id="toc-list"></ol>
      </details>

      <footer class="side-footer">© <span id="year"></span> My Blog</footer>
    </aside>

    <main id="main" class="content">
      <article class="post" id="post" aria-live="polite">
        <p class="status">Loading post…</p>
      </article>
      <nav class="back-nav back-nav-bottom" aria-label="Back"><a href="./">&lt;- Back to list</a></nav>
    </main>
  </div>
</body>
</html>
